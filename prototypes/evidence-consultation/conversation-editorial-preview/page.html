<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>会話のかたち | We育 編集見本</title>
<style>
@font-face{font-family:Local;src:url(data:font/woff2;base64,FONT_BASE64)}*{box-sizing:border-box}body{margin:0;background:#f6f4f1;color:#312d38;font:15px/1.9 Local,sans-serif}button,textarea{font:inherit}button,summary,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #6d498c;outline-offset:4px}.top{background:#fff;border-bottom:1px solid #e6e0e8;padding:18px max(24px,calc((100vw - 1000px)/2));display:flex;gap:20px;align-items:center}.brand{color:#73518c;font-size:23px;white-space:nowrap}.tag{font-size:12px;color:#655670}main{max-width:920px;margin:44px auto 130px;padding:0 24px}.eyebrow{font-size:12px;letter-spacing:.14em;color:#756283}h1{font-size:32px;line-height:1.6;margin:8px 0 12px;letter-spacing:.02em}.lead{color:#66606c;max-width:680px}.privacy{font-size:12px;background:#eeebe6;padding:13px 18px;border-radius:12px;margin:24px 0}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0 0}nav button{border:1px solid #e0d8e6;background:#eeeaf0;border-radius:16px 16px 0 0;padding:16px 8px;color:#60566b;font-size:13px}nav button[aria-selected=true]{background:#fff;color:#684582;border-bottom-color:#fff;font-weight:bold}nav span{display:block;font-size:11px;color:#77707e}.panel{background:white;border:1px solid #e0d8e6;border-radius:0 0 24px 24px;padding:28px 36px}.scene-label{font-size:12px;color:#695476;background:#f3eef8;border-radius:8px;padding:8px 12px;margin:0 0 8px}h2{font-size:20px;margin:12px 0 6px}.progress{color:#7a7380;font-size:12px}.chat{display:flex;flex-direction:column;gap:24px;margin:28px 0}.message{max-width:88%;white-space:pre-wrap}.who{font-size:11px;color:#7b7181;margin:0 0 7px}.parent{align-self:flex-end}.parent .bubble{background:#eee6f5;border-radius:20px 20px 4px 20px}.answer .bubble{background:#f5f5f2;border-radius:4px 20px 20px 20px}.bubble{padding:18px 22px}.bubble p{margin:0}.bubble .note{font-size:12px;color:#66606c;margin-top:14px}.question{border-top:1px solid #ddd4e5;padding-top:14px;margin-top:14px!important;color:#644381}.guidance{max-width:100%;border-left:3px solid #91a89a;padding:0 0 0 20px}.guidance p{font-size:14px}.guidance h3{font-size:16px;margin:0}.editorial{font-size:11px;color:#52695c}.emergency{border-top:1px solid #dbe2dd;padding-top:14px}.actions{border-top:1px solid #eee8f1;padding-top:22px}#next{border:0;border-radius:12px;padding:14px 24px;background:#76528e;color:white}#next:disabled{background:#eee9f1;color:#66596e;cursor:default}.preset{font-size:12px;color:#6e6475;margin:8px 0 18px}details{border-top:1px solid #e9e3ec;padding:16px 0;font-size:13px}summary{cursor:pointer;color:#694981}details p{overflow-wrap:anywhere}.trace{font-size:11px;color:#69606f}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f3f8;padding:16px;font:11px/1.8 Local,sans-serif}a{color:#694981}textarea{width:100%;resize:vertical;min-height:96px;padding:12px;border:1px solid #d6cedc;border-radius:12px;background:#fcfbfd;color:#312d38}label{display:block;font-size:13px;margin:12px 0}.endbar{position:fixed;bottom:0;left:0;right:0;background:#fffc;border-top:1px solid #ddd3e2;backdrop-filter:blur(10px);padding:14px 24px;display:flex;justify-content:center;align-items:center;gap:24px;z-index:5}.endbar span{font-size:11px;color:#6e6079}.endbar button{background:#fff;border:1px solid #78578c;color:#604175;border-radius:10px;padding:10px 18px}.ended{padding:70px 24px;text-align:center}#link-note{font-size:12px;color:#75617f}@media(max-width:600px){main{margin-top:26px;padding:0 15px}h1{font-size:25px}.top{padding:15px;gap:12px}.tag{font-size:10px}.panel{padding:18px 16px}nav button{font-size:11px;padding:12px 3px}nav span{font-size:10px}.message{max-width:96%}.bubble{padding:16px}.endbar{padding:12px;gap:12px}.endbar span{max-width:130px}.endbar button{font-size:12px}.privacy{font-size:11px}}
</style></head>
<body><header class="top"><div class="brand">We育<span style="font-size:12px"> / EDITORIAL</span></div><div class="tag">非公開・オフライン<br>GLOBAL_LABEL</div></header>
<main><div class="eyebrow">CONVERSATION STUDY / 01</div><h1>まず答える。必要なところだけ、<br>一緒に確かめる。</h1><p class="lead">育児の相談が、どんな会話になると読みやすいか。<br>資料で言えることと、言えないことを分けた、3つの編集見本です。</p>
<div class="privacy">ここは相談サービスではありません。すべて架空の設定・あらかじめ編集した文章です。通信・回答生成・予約・相談共有はありません。VNCはワークスペースの権限を持つ人から見える場合があります。個人情報や実際の健康情報は入力しないでください。</div>
<nav role="tablist" aria-label="会話見本の場面"></nav><section class="panel" id="panel" role="tabpanel" tabindex="0"></section>
</main><footer class="endbar"><span id="lifetime">この画面は60分で終了<br>入力は保存しません</span><button id="end" type="button">プレビューを終了</button></footer>
<script>
"use strict";
const scenes=SCENES_JSON, trace=TRACE_JSON;
const label="GLOBAL_LABEL";
let selected=0,visible=2,ended=false;const drafts=["","",""];
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;};
const nav=document.querySelector("nav"),panel=document.querySelector("#panel");
scenes.forEach((s,i)=>{const b=el("button","",String(i+1).padStart(2,"0")+" "+s.title);b.type="button";b.id="tab-"+i;b.setAttribute("role","tab");b.setAttribute("aria-controls","panel");b.append(el("span","",s.subtitle));b.onclick=()=>{selected=i;visible=2;render();};b.onkeydown=e=>{if(["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){e.preventDefault();const n=e.key==="Home"?0:e.key==="End"?2:(i+(e.key==="ArrowRight"?1:2))%3;nav.children[n].click();nav.children[n].focus();}};nav.append(b);});
function disclosure(title,cls){const d=el("details",cls);d.append(el("summary","",title));return d;}
function render(){
 const s=scenes[selected];panel.replaceChildren();panel.setAttribute("aria-labelledby","tab-"+selected);
 [...nav.children].forEach((b,i)=>{b.setAttribute("aria-selected",String(i===selected));b.tabIndex=i===selected?0:-1;});
 panel.append(el("p","scene-label",label),el("h2","",s.subtitle),el("p","progress","見本 "+(selected+1)+" / 3 · 編集済みの会話 "+visible+" / "+s.messages.length+" 発言"));
 const chat=el("div","chat");chat.setAttribute("aria-live","polite");
 s.messages.slice(0,visible).forEach(m=>{
  const a=el("article","message "+m.role);a.append(el("p","who",m.role==="parent"?"保護者の発言見本":m.role==="guidance"?"人への相談につなぐ見本":"回答の文章見本"));
  if(m.role==="guidance"){a.append(el("span","editorial","編集上の運用案内 · 臨床的な根拠の引用ではありません"),el("h3","",m.text),el("p","",m.support),el("p","",m.medical),el("p","emergency",m.emergency));}
  else {const b=el("div","bubble");b.append(el("p","",m.text));if(m.note)b.append(el("p","note",m.note));if(m.question)b.append(el("p","question",m.question));a.append(b);}
  chat.append(a);
 });panel.append(chat);
 const actions=el("div","actions"),next=el("button","","次の会話見本を見る");next.id="next";next.type="button";next.disabled=visible>=s.messages.length;next.onclick=()=>{visible=Math.min(visible+1,s.messages.length);render();document.querySelector("#next").focus();};
 actions.append(next,el("p","preset",visible>=s.messages.length?"この場面の見本はここまでです。ほかの場面は上のタブで読めます。":"続きも編集済みの文章です。入力に応じた返信ではありません。"));panel.append(actions);
 const evidence=disclosure("根拠を見る","evidence");
 evidence.append(el("p","",trace.sourceTitle+"（厚生労働省）"));
 const a=el("a","",trace.sourceUrl);a.href=trace.sourceUrl;a.rel="noreferrer noopener";a.onclick=e=>{e.preventDefault();document.querySelector("#link-note").textContent="通信を行わない見本のため、外部リンクへの移動は無効です。URLの表示のみです。";};evidence.append(a,el("p","","このリンクは出典の識別用です。オフライン画面からは開きません。"),el("p","","ガイドが紹介する推奨と編集上の説明を区別しています。編集・要約はWe育側によるもので、発行元の承認を示しません。"),el("p","",trace.attribution));
 const notice=el("p");notice.id="link-note";notice.setAttribute("role","status");evidence.append(notice);panel.append(evidence);
 const reviewer=disclosure("レビュー担当者用：原文・位置・ハッシュ","trace");
 reviewer.append(el("p","",trace.status),el("pre","",JSON.stringify({...trace,fragments:[trace.fragments[s.source]],scenes:[trace.scenes[selected]]},null,2)));panel.append(reviewer);
 const draft=disclosure("自分の言葉でメモする（任意・送信なし）","draft");
 const lab=el("label","","架空の下書きだけを入力してください");lab.htmlFor="draft";const input=el("textarea");input.id="draft";input.value=drafts[selected];input.autocomplete="off";input.spellcheck=false;input.oninput=()=>{drafts[selected]=input.value;};
 draft.append(lab,input,el("p","","下書きはこの画面のメモリ内だけです。送信・生成されず、会話見本にも影響しません。終了・再読み込みで消えます。"));panel.append(draft);
}
async function end(reason){if(ended)return;ended=true;drafts.fill("");clearTimeout(timer);document.body.replaceChildren(el("div","ended","プレビューを終了しました。下書きは破棄しました。"));if(typeof window.endEditorialPreview==="function"){try{await window.endEditorialPreview(reason);}catch{document.body.append(el("p","","ブラウザの終了を確認できません。ウィンドウを閉じてください。"));}}}
document.querySelector("#end").onclick=()=>end("button");
const timer=setTimeout(()=>end("ttl"),60*60*1000);
render();
</script></body></html>
